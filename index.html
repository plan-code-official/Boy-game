<!DOCTYPE html>
<html>
<head>
  <title>لعبة الحروف العربية للأطفال</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- Import Google Fonts including Cairo for clean premium Arabic rendering -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&family=Orbitron:wght@600;800&family=Outfit:wght@400;500;700&family=Lateef:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <!-- HUD overlay container -->
  <div id="hud">
    <div style="flex: 1; display: flex; gap: 15px; align-items: flex-start;">
      <div id="score-panel" class="hud-item glass-panel" style="flex-direction: row; align-items: center; gap: 8px;">
        <span id="score-val" class="value text-glow-yellow">0</span>
        <img src="/src/assets/daddcoin.webp" alt="Coins" class="hud-coin-icon" style="width: 26px; height: 26px;">
      </div>
      
      <div id="combo-panel" class="hud-item glass-panel" style="display: none;">
        <span class="label" style="color: #ffeb3b;">المضاعف</span>
        <span id="combo-val" class="value text-glow-yellow">x1</span>
      </div>
    </div>

    <!-- Center target word collection panel -->
    <div style="flex: 1; display: flex; justify-content: center;">
      <div id="word-target-container" class="hud-item glass-panel">
        <div id="word-slots"></div>
      </div>
    </div>

    <div style="flex: 1;"></div>
  </div>

  <!-- Tutorial Removed per user request -->

  <!-- Win Overlay Removed (now handled by React component EndGameFlow) -->


  <!-- Error Overlay -->
  <div id="error-overlay" class="glass-panel hidden">
    <h2 style="color: #ff3333;">خطأ</h2>
    <p id="error-message">حدث خطأ أثناء تحميل اللعبة.</p>
  </div>

  <!-- Portrait Orientation Warning Overlay -->
  <div id="portrait-overlay" class="rotate-screen-overlay">
    <div class="rotate-icon-container">
      <svg class="phone-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
        <line x1="12" y1="18" x2="12.01" y2="18"></line>
      </svg>
    </div>
    <p>قم بتدوير الهاتف بالعرض</p>
  </div>

  <!-- Mobile On-Screen Controls -->
  <div id="mobile-controls" class="hidden-desktop">
    <div class="dpad-container">
      <div class="dpad-row">
        <button class="ctrl-btn dpad-btn" id="btn-up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="dpad-row">
        <button class="ctrl-btn dpad-btn" id="btn-left">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <button class="ctrl-btn dpad-btn" id="btn-down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
        </button>
        <button class="ctrl-btn dpad-btn" id="btn-right">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
    </div>
    
    <div class="action-container" style="display: flex; flex-direction: column; gap: 15px; width: 85px;">
      <button class="ctrl-btn action-btn" id="btn-jump-right" style="background: rgba(50, 255, 50, 0.2); border-color: rgba(50, 255, 50, 0.5);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
      <button class="ctrl-btn action-btn" id="btn-run" style="background: rgba(50, 200, 255, 0.2); border-color: rgba(50, 200, 255, 0.5);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"></polygon><polygon points="2 19 11 12 2 5 2 19"></polygon></svg>
      </button>
    </div>
  </div>

  <script type="module" src="/src/index.js"></script>
</body>
</html>
